body: |
  ## What this SAMPLE demonstrates

  This fixture exists so desktop patterns and the mobile stack can be inspected with the same content. It is **not** a claim about a shipped product.

  ### Content reuse

  Real portfolio posts should draw from documented work such as surgical trainers, embedded devices, and engineering platforms described in the repository source notes. Do not invent metrics or achievements.

  ### Reading length

  Long bodies remain fully readable. Text panels grow with content instead of clipping to a fixed height. Missing optional images collapse cleanly while the project link stays available.

  - Cover uses an intentional crop with a focal point
  - Supporting images default to containing the full frame
  - Draft posts stay out of public indexes
